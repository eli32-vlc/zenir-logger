{{define "content"}}
<div class="dashboard">
    <section>
        <h2>Create New Link</h2>
        <form action="/admin/create" method="POST">
            <fieldset>
                <div class="form-group">
                    <label for="target">Target URL</label>
                    <input type="url" id="target" name="target" placeholder="https://example.com" required>
                </div>
                <div class="form-group">
                    <label for="slug">Custom Slug (Optional)</label>
                    <input type="text" id="slug" name="slug" placeholder="custom-path">
                </div>
                <button type="submit">Generate Link</button>
            </fieldset>
        </form>
    </section>

    <section>
        <h2>Active Links</h2>
        <table>
            <thead>
                <tr>
                    <th>Slug</th>
                    <th>Target</th>
                    <th>Created At</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                {{range .Data}}
                <tr>
                    <td><a href="/admin/stats?slug={{.Slug}}">{{.Slug}}</a></td>
                    <td><a href="{{.Target}}" target="_blank">{{.Target}}</a></td>
                    <td>{{.CreatedAt.Format "2006-01-02 15:04:05"}}</td>
                    <td>
                        <a href="/admin/stats?slug={{.Slug}}">[STATS]</a>
                        <form action="/admin/delete" method="POST" style="display:inline;"
                            onsubmit="return confirm('Are you sure you want to delete this link?');">
                            <input type="hidden" name="id" value="{{.ID}}">
                            <button type="submit" class="btn btn-error btn-small">Delete</button>
                        </form>
                    </td>
                </tr>
                {{end}}
            </tbody>
        </table>
    </section>
</div>
{{end}}
